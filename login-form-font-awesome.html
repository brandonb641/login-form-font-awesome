
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form Font Awesome</title>
    <link rel="stylesheet" href="login-form-font-awesome.css">
</head>
<body>

    <div class="login">
        <img src="img/profile.png" alt="Profile Picture" class="profile">

        <main>
            <h2>Flat Business Profile Widget</h2>

            <form>
                <div class="input-group">
                    <i class="fa fa-user" aria-hidden="true"></i>
                    <input type="text" placeholder="Name">
                </div>

                <div class="input-group">
                    <i class="fa fa-unlock-alt" aria-hidden="true"></i>
                    <input type="password" placeholder="Password">
                </div>

                <button type="submit">Submit</button>
            </form>
        </main>

        <footer>
            © 2016 Flat Business Profile Widget. All rights reserved.
        </footer>
    </div>

</body>
</html>
